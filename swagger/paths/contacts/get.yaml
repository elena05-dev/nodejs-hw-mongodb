tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve all contacts for the current user, with optional query parameters for filtering
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      example: 20
    description: Number of contacts per page
responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
