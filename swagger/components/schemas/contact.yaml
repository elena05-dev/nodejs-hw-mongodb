type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    type: string
    description: MongoDB document ID
    example: '65ca67e7ae7f10c88b598384'
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+123456789'
  email:
    type: string
    example: 'john@example.com'
  isFavourite:
    type: boolean
    default: false
    example: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    default: personal
    example: personal
  userId:
    type: string
    description: ID of the user who owns the contact
    example: '64b123abc456def7890abcd1'
  photo:
    type: string
    description: URL or path to contact's photo
    example: 'https://example.com/uploads/contact-photo.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-10-15T15:23:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-10-15T15:25:00.000Z'
